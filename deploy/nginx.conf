server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 10s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
